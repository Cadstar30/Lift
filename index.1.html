<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Space Invaders ULTRA</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#070b1d;color:#eaf3ff;font-family:Consolas,monospace;display:flex;flex-direction:column;align-items:center;padding:4px 8px;gap:4px}h1{flex:0 0 auto;color:#4be1ff;font-size:clamp(15px,2.8vh,25px);line-height:1.1;margin:2px 0}canvas{display:block;width:auto;height:auto;max-width:100%;max-height:calc(100dvh - 78px);aspect-ratio:800/650;object-fit:contain;border:2px solid #364b83;background:#080a1b;touch-action:none;min-height:0}p{flex:0 0 auto;margin:2px 0;max-width:100%;text-align:center;font-size:clamp(9px,1.5vh,13px);line-height:1.3;color:#b8c9ef}button{background:#263f78;color:white;border:1px solid #65baff;border-radius:8px;padding:7px;cursor:pointer}#shop{display:none;position:fixed;z-index:5;top:50%;left:50%;transform:translate(-50%,-50%);width:min(94vw,700px);max-height:92dvh;overflow-y:auto;background:#101a39;border:2px solid #65baff;border-radius:14px;padding:12px;text-align:center;box-shadow:0 0 0 100vmax #0009}#shop h2{margin:0 0 8px;font-size:clamp(16px,3vh,24px)}#shop button{font-size:clamp(11px,1.6vh,14px);margin:3px;min-height:32px}#shop .shop-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}#shop .shop-grid button{margin:0}#shop #continue{margin-top:8px;background:#17664d;font-weight:bold}@media(max-height:500px){body{gap:1px;padding:2px}h1{font-size:14px}canvas{max-height:calc(100dvh - 53px)}p{font-size:9px}#shop{padding:5px}#shop button{min-height:24px;padding:3px}}
</style></head><body><h1>SPACE INVADERS ULTRA</h1><canvas id="game" width="800" height="650"></canvas><div id="shop"></div><p>Move: A/D or ←/→ · Shoot: SPACE · Dash: SHIFT · Rocket: Q · Bomb: E · Super: F · Overdrive: G · Pause: P · Restart: R</p><script>
const c=document.getElementById('game'),x=c.getContext('2d'),shop=document.getElementById('shop'),W=800,H=650;let keys={},last=0,s;const colors=['#ff64a0','#ffbe50','#64ebff','#9b78ff'];const rand=(a,b)=>a+Math.random()*(b-a);const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;const txt=(t,xx,yy,col='#eef5ff',size=20,align='left')=>{x.fillStyle=col;x.font=`bold ${size}px Consolas`;x.textAlign=align;x.fillText(t,xx,yy)};const rect=(a,col)=>{x.fillStyle=col;x.fillRect(a.x,a.y,a.w,a.h)};let stars=Array.from({length:100},()=>({x:rand(0,W),y:rand(0,H),r:rand(1,2)}));const upgrades=[['damage','Weapon damage +1',70],['fire','Faster shooting',65],['speed','Faster movement',50],['life','Extra life',90],['armor','Armor',100],['spread','Multi-shot',130],['pet','Robot companion',120],['rocket','Rockets +3',75],['bomb','Bombs +2',95],['super','Super beam +1',160],['maxhp','Max HP +25',85],['repair','Repair +40',65],['regen','Auto repair',110],['energy','Energy boost',100]];function wave(){s.aliens=[];s.boss=null;s.rocks=[];s.eb=[];s.bullets=[];s.drops=[];s.direction=1;s.shop=false;s.killsWave=0;s.hp=Math.min(s.maxhp,s.hp+15);if(s.level%3===0){s.boss={x:325,y:90,w:150,h:65,hp:20+s.level*7,max:20+s.level*7,v:130,shot:0,spawn:0};}else for(let row=0;row<4;row++)for(let col=0;col<9;col++){let elite=s.level>=2&&Math.random()<Math.min(.5,.07+s.level*.025);s.aliens.push({x:95+col*67,y:75+row*52,w:38,h:29,hp:elite?2+Math.floor(s.level/3):1,elite,row})}}function reset(){s={px:400,hp:100,maxhp:100,lives:3,level:1,score:0,coins:0,energy:0,armor:0,rockets:2,bombs:1,supers:0,up:{},bullets:[],eb:[],aliens:[],drops:[],rocks:[],boss:null,shop:false,over:false,paused:false,lastShot:0,lastEnemy:0,lastRock:0,lastPet:0,lastRegen:0,dash:0,inv:0,active:{},combo:0,lastKill:0,kills:0,bossKills:0,notice:'LEVEL 1!',noticeUntil:2};wave();shop.style.display='none'}function message(t){s.notice=t;s.noticeUntil=performance.now()/1000+1.6}function finish(){s.shop=true;s.bullets=[];s.eb=[];s.drops=[];s.rocks=[];renderShop()}function renderShop(){shop.style.display='block';shop.innerHTML='<h2>UPGRADE SHOP — '+s.coins+' coins</h2><div class="shop-grid">'+upgrades.map(([k,n,price],i)=>`<button data-i="${i}">${i<9?i+1:i===9?'0':['H','J','K','L'][i-10]}: ${n} (${price+10*(s.level-1)} coins)</button>`).join('')+'</div><button id="continue">NEXT WAVE →</button>';shop.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>buy(+b.dataset.i));document.getElementById('continue').onclick=nextWave}function buy(i){if(!s.shop)return;let [k,n,base]=upgrades[i],cost=base+10*(s.level-1);if(s.coins<cost){message('NOT ENOUGH COINS');return}if(k==='repair'&&s.hp>=s.maxhp)return;s.coins-=cost;s.up[k]=(s.up[k]||0)+1;if(k==='life')s.lives++;if(k==='armor')s.armor++;if(k==='rocket')s.rockets+=3;if(k==='bomb')s.bombs+=2;if(k==='super')s.supers++;if(k==='maxhp'){s.maxhp+=25;s.hp+=25}if(k==='repair')s.hp=Math.min(s.maxhp,s.hp+40);renderShop()}function nextWave(){s.level++;wave();shop.style.display='none';message(s.boss?'BOSS BATTLE!':'LEVEL '+s.level)}function fire(){let count=s.active.bigship?5:(s.active.triple||(s.up.spread||0)>0?3:1);for(let i=0;i<count;i++){let offset=(i-(count-1)/2)*17;s.bullets.push({x:s.px+offset-3,y:565,w:s.active.laser?10:6,h:19,vx:offset*7,damage:1+(s.up.damage||0),pierce:!!s.active.laser,hit:new Set()})}}function kill(a){s.score+=(a.elite?25:10)*(1+Math.min(4,Math.floor(s.combo/5)));s.coins+=(a.elite?14:5)*(1+Math.min(4,Math.floor(s.combo/5)));s.energy=Math.min(100,s.energy+5+2*(s.up.energy||0));s.kills++;s.combo=performance.now()/1000-s.lastKill<2.2?s.combo+1:1;s.lastKill=performance.now()/1000;if(Math.random()<.18)s.drops.push({x:a.x+8,y:a.y,w:25,h:25,kind:['triple','rapid','shield','laser','bigship','repair','overdrive'][Math.floor(rand(0,7))]});if(s.kills===1||s.kills===50)s.coins+=40}function damage(n){let now=performance.now()/1000;if(now<s.inv||s.active.shield)return;if(s.armor)s.armor--;else{s.hp-=n;if(s.hp<=0){s.lives--;if(s.lives<=0){s.hp=0;s.over=true}else s.hp=s.maxhp}}s.inv=now+1.4}function blast(power){for(let a of [...s.aliens]){a.hp-=power;if(a.hp<=0){s.aliens.splice(s.aliens.indexOf(a),1);kill(a)}}if(s.boss){s.boss.hp-=power;if(s.boss.hp<=0)bossKill()}}function bossKill(){s.score+=500+s.level*100;s.coins+=150+s.level*30;s.bossKills++;s.boss=null;finish()}window.addEventListener('keydown',e=>{if(['Space','ArrowLeft','ArrowRight','ShiftLeft','ShiftRight'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.repeat)return;let k=e.key.toLowerCase(),now=performance.now()/1000;if(k==='r'&&s.over)reset();else if(k==='p'&&!s.shop&&!s.over)s.paused=!s.paused;else if(s.shop){let i=k==='0'?9:'123456789'.includes(k)?+k-1:({h:10,j:11,k:12,l:13})[k];if(i!==undefined)buy(i);if(e.key==='Enter'||e.code==='Space')nextWave()}else if(!s.over&&!s.paused){if(k==='q'&&s.rockets){s.rockets--;blast(6);message('ROCKET!')}if(k==='e'&&s.bombs){s.bombs--;blast(3);message('MEGA BOMB!')}if(k==='f'&&s.supers){s.supers--;blast(18);message('SUPER NOVA!')}if(k==='g'&&s.energy>=100){s.energy=0;s.active.overdrive=now+9;s.hp=Math.min(s.maxhp,s.hp+20);message('OVERDRIVE!')}}});window.addEventListener('keyup',e=>keys[e.code]=false);function update(dt,now){if(s.paused||s.shop||s.over)return;for(let k of Object.keys(s.active))if(now>s.active[k])delete s.active[k];let dir=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);s.px=Math.max(25,Math.min(775,s.px+dir*(340+55*(s.up.speed||0))*dt));if(dir&&(keys.ShiftLeft||keys.ShiftRight)&&now>s.dash){s.px=Math.max(25,Math.min(775,s.px+dir*125));s.dash=now+3.5;s.inv=now+.3}let cooldown=Math.max(.055,(s.active.rapid?.085:s.active.bigship?.145:.22)-.025*(s.up.fire||0));if(s.active.overdrive)cooldown=Math.max(.04,cooldown/2);if(keys.Space&&now-s.lastShot>cooldown){fire();s.lastShot=now}if(s.up.regen&&now-s.lastRegen>2.5){s.hp=Math.min(s.maxhp,s.hp+2*s.up.regen);s.lastRegen=now}if(s.level>=2&&now-s.lastRock>Math.max(.65,2.5-s.level*.12)){let z=rand(20,39);s.rocks.push({x:rand(20,760),y:-z,w:z,h:z,hp:2,v:rand(130,190)+s.level*12});s.lastRock=now}if(s.up.pet&&now-s.lastPet>Math.max(.2,.9-s.up.pet*.16)){for(let i=0;i<s.up.pet;i++)s.bullets.push({x:s.px+(i-(s.up.pet-1)/2)*62,y:550,w:5,h:14,vx:0,damage:1+(s.up.damage||0),pierce:false,hit:new Set()});s.lastPet=now}let player={x:s.px-23,y:574,w:46,h:32};for(let rock of [...s.rocks]){rock.y+=rock.v*dt;if(rock.y>H)s.rocks.splice(s.rocks.indexOf(rock),1);else if(hit(rock,player)){s.rocks.splice(s.rocks.indexOf(rock),1);damage(25)}}for(let b of [...s.bullets]){b.y-=550*dt;b.x+=b.vx*dt;if(b.y<0){s.bullets.splice(s.bullets.indexOf(b),1);continue}let remove=false;for(let rock of [...s.rocks])if(hit(b,rock)){rock.hp-=b.damage;if(rock.hp<=0){s.rocks.splice(s.rocks.indexOf(rock),1);s.coins+=3}s.energy=Math.min(100,s.energy+2);if(!b.pierce)remove=true;break}if(!remove)for(let a of [...s.aliens])if(hit(b,a)&&!b.hit.has(a)){b.hit.add(a);a.hp-=b.damage;if(a.hp<=0){s.aliens.splice(s.aliens.indexOf(a),1);kill(a)}if(!b.pierce)remove=true;break}if(!remove&&s.boss&&hit(b,s.boss)&&!b.hit.has(s.boss)){b.hit.add(s.boss);s.boss.hp-=b.damage;if(s.boss.hp<=0)bossKill();if(!b.pierce)remove=true}if(remove&&s.bullets.includes(b))s.bullets.splice(s.bullets.indexOf(b),1)}if(s.shop)return;if(s.boss){let b=s.boss;b.x+=b.v*dt;if(b.x<20||b.x+b.w>780)b.v*=-1;let rage=b.hp<b.max/2;if(now-b.shot>Math.max(.26,1.05-s.level*.04-(rage?.2:0))){for(let off of (rage?[-60,-30,0,30,60]:[-45,0,45]))s.eb.push({x:b.x+75+off,y:b.y+65,w:8,h:18});b.shot=now}if(now-b.spawn>Math.max(1.7,4.2-s.level*.12)&&s.aliens.length<12){for(let i=0;i<3;i++)s.aliens.push({x:Math.max(20,Math.min(740,b.x+i*50)),y:190+i%2*43,w:38,h:29,hp:2,elite:true,row:i});b.spawn=now}}else{let dx=s.direction*(30+s.level*12+Math.max(0,36-s.aliens.length)*1.5)*dt;if(s.aliens.some(a=>a.x+dx<20||a.x+a.w+dx>780)){s.direction*=-1;s.aliens.forEach(a=>a.y+=19)}else s.aliens.forEach(a=>a.x+=dx)}if(s.aliens.length&&now-s.lastEnemy>Math.max(.32,1.15-s.level*.075)){let a=s.aliens[Math.floor(rand(0,s.aliens.length))];s.eb.push({x:a.x+16,y:a.y+29,w:7,h:16});s.lastEnemy=now}for(let b of [...s.eb]){b.y+=(240+s.level*30)*dt;if(b.y>H||hit(b,player)){s.eb.splice(s.eb.indexOf(b),1);if(hit(b,player))damage(20+Math.min(20,s.level*2))}}for(let d of [...s.drops]){d.y+=125*dt;if(d.y>H)s.drops.splice(s.drops.indexOf(d),1);else if(hit(d,player)){if(d.kind==='repair')s.hp=Math.min(s.maxhp,s.hp+25);else s.active[d.kind]=now+({triple:11,rapid:10,shield:12,laser:9,bigship:14,overdrive:9}[d.kind]);s.coins+=5;s.drops.splice(s.drops.indexOf(d),1);message(d.kind.toUpperCase()+'!')}}if(s.aliens.some(a=>a.y+a.h>=574))s.over=true;if(!s.boss&&!s.aliens.length)finish()}function draw(now){x.fillStyle='#080a1b';x.fillRect(0,0,W,H);for(let a of stars){x.fillStyle='#455078';x.beginPath();x.arc(a.x,a.y,a.r,0,Math.PI*2);x.fill()}txt('SCORE '+s.score,15,28);txt('LVL '+s.level,230,28,'#ffe15a');txt('🟡 '+s.coins,355,28,'#ff9937');txt('LIVES '+s.lives,605,28,'#46ff8c');rect({x:565,y:45,w:220,h:17},'#412436');rect({x:565,y:45,w:220*Math.max(0,s.hp)/s.maxhp,h:17},'#46ff8c');txt('SHIP HP '+s.hp+'/'+s.maxhp,580,80,'#fff',16);rect({x:15,y:77,w:185,h:12},'#252b54');rect({x:15,y:77,w:185*s.energy/100,h:12},'#ff9137');txt('ENERGY '+s.energy+'% [G]',15,108,'#fff',16);if(s.combo>=5)txt('COMBO '+s.combo,15,62,'#ffe15a',16);for(let a of s.aliens){rect(a,a.elite?'#ff9137':colors[a.row%4]);rect({x:a.x+9,y:a.y+10,w:5,h:5},'#11152a');rect({x:a.x+25,y:a.y+10,w:5,h:5},'#11152a')}if(s.boss){let b=s.boss;x.fillStyle=b.hp<b.max/2?'#ff5577':'#a77aff';x.beginPath();x.ellipse(b.x+75,b.y+32,75,33,0,0,Math.PI*2);x.fill();rect({x:b.x+57,y:b.y+25,w:36,h:18},'#ff5577');rect({x:220,y:49,w:360,h:15},'#47243f');rect({x:220,y:49,w:360*Math.max(0,b.hp)/b.max,h:15},'#ff5577');txt('BOSS',350,45,'#fff',15)}for(let a of s.rocks){x.fillStyle='#8b7468';x.beginPath();x.arc(a.x+a.w/2,a.y+a.h/2,a.w/2,0,Math.PI*2);x.fill()}for(let b of s.bullets)rect(b,b.pierce?'#ff9137':'#46ff8c');for(let b of s.eb)rect(b,'#ff5577');for(let d of s.drops){x.fillStyle='#bd75ff';x.beginPath();x.arc(d.x+12,d.y+12,13,0,Math.PI*2);x.fill();txt(d.kind[0].toUpperCase(),d.x+12,d.y+18,'#111',17,'center')}if(!s.over&&(now>s.inv||Math.floor(now*8)%2===0)){x.fillStyle='#4be1ff';x.beginPath();x.moveTo(s.px,555);x.lineTo(s.px-23,590);x.lineTo(s.px+23,590);x.closePath();x.fill();rect({x:s.px-7,y:583,w:14,h:19},'#46ff8c');if(s.active.shield){x.strokeStyle='#4be1ff';x.lineWidth=3;x.beginPath();x.arc(s.px,580,39,0,Math.PI*2);x.stroke()}}txt('Armor '+s.armor+' | Q Rockets '+s.rockets+'  E Bombs '+s.bombs+'  F Super '+s.supers+' | P Pause',16,628,'#fff',16);txt('SHIFT Dash: '+(now>s.dash?'READY':(s.dash-now).toFixed(1)+'s'),15,601,'#4be1ff',16);if(now<s.noticeUntil&&!s.shop)txt(s.notice,400,320,'#ffe15a',25,'center');if(s.shop||s.paused||s.over){x.fillStyle='rgba(0,0,0,.84)';x.fillRect(0,0,W,H);if(s.shop){txt('UPGRADE SHOP',400,150,'#4be1ff',45,'center');txt(s.coins+' COINS  |  NEXT LEVEL '+(s.level+1),400,215,'#ffe15a',23,'center');txt('Buy upgrades using buttons below',400,285,'#fff',20,'center');txt('Press ENTER to continue',400,340,'#46ff8c',25,'center')}else if(s.paused){txt('PAUSED',400,280,'#4be1ff',49,'center');txt('Press P to resume',400,345,'#fff',24,'center')}else{txt('GAME OVER',400,260,'#ff5577',49,'center');txt('Score: '+s.score+'   Level: '+s.level,400,335,'#fff',24,'center');txt('Enemies: '+s.kills+'  Bosses: '+s.bossKills,400,375,'#ffe15a',20,'center');txt('Press R to restart',400,435,'#46ff8c',25,'center')}}}function loop(t){let now=t/1000,dt=Math.min(.05,(t-last)/1000||.016);last=t;update(dt,now);draw(now);requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);
</script></body></html>
